<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050713" />
  <title>VENSO Admin</title>
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="admin-body">
  <div class="noise"></div>
  <div class="stars stars-one"></div>
  <div class="stars stars-two"></div>

  <main class="admin-shell">
    <section class="admin-card login-card" id="loginView">
      <a class="brand admin-brand" href="/"><img src="/assets/logo.png" alt="VENSO" /></a>
      <h1>Админка VENSO</h1>
      <p>Здесь можно менять тарифы лендинга и смотреть заявки. Пароль по умолчанию указан в README.</p>
      <form id="loginForm" class="admin-form">
        <label>Пароль администратора<input type="password" name="password" placeholder="Введите пароль" required /></label>
        <button class="primary-btn" type="submit">Войти</button>
      </form>
      <div class="admin-alert" id="loginAlert"></div>
    </section>

    <section class="admin-dashboard" id="dashboardView" hidden>
      <div class="admin-topbar">
        <a class="brand admin-brand" href="/"><img src="/assets/logo.png" alt="VENSO" /></a>
        <div>
          <h1>Управление лендингом</h1>
          <p>Редактирование тарифов происходит без правки кода.</p>
        </div>
        <button class="ghost-btn sm" id="logoutBtn">Выйти</button>
      </div>

      <div class="admin-columns">
        <section class="admin-card tariffs-editor">
          <div class="admin-section-title">
            <h2>Тарифы</h2>
            <button class="ghost-btn sm" id="addTariffBtn" type="button">Добавить тариф</button>
          </div>
          <form id="tariffsForm">
            <div id="tariffsEditor"></div>
            <button class="primary-btn" type="submit">Сохранить тарифы</button>
          </form>
          <div class="admin-alert" id="saveAlert"></div>
        </section>

        <aside class="admin-card leads-panel">
          <div class="admin-section-title">
            <h2>Заявки</h2>
            <button class="ghost-btn sm" id="refreshLeadsBtn" type="button">Обновить</button>
          </div>
          <div class="leads-list" id="leadsList"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="/js/admin.js" defer></script>
</body>
</html>
